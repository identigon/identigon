name: _Build

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One Gradle build for all three subprojects, run on both:
        # - windows-latest: alterego treats Windows as a first-class target (FileMappingStore
        #   relies on FileChannel locking, whose semantics differ from POSIX).
        # - ubuntu-latest: ships with Docker, so incognito's Testcontainers PostgreSQL E2Es run for
        #   real here. They skip gracefully on windows-latest, which has no Docker daemon.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the root build.gradle.kts derives SNAPSHOT-vs-release from
          # `git describe --tags --exact-match`, which needs tags present to find anything.
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./gradlew build
      # Downloadable from the run's Summary page even when the build step above fails (the usual
      # time someone actually wants them) -- !cancelled() runs on success/failure but skips a
      # cancelled run, unlike always(). One glob per report kind covers all three subprojects
      # without naming them, and stays correct if a fourth is ever added. SpotBugs XML is off
      # (root build.gradle.kts), so only its HTML is picked up here.
      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports-${{ matrix.os }}
          path: |
            */build/test-results/test/
            */build/reports/tests/test/
            */build/reports/jacoco/test/
            */build/reports/checkstyle/
            */build/reports/pmd/
            */build/reports/spotbugs/
          if-no-files-found: warn
