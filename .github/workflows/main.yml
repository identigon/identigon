name: Main

on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to publish alterego and incognito
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the root build.gradle.kts derives SNAPSHOT-vs-release from
          # `git describe --tags --exact-match`, which needs tags present to find anything.
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Publish to GitHub Packages
        # Publishes every subproject with a publishing {} block -- alterego and incognito today.
        # effigies has none (it ships as a runnable jar, not a Maven artifact), so this is a no-op
        # for it.
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
