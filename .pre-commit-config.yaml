# Minimal code-hygiene hooks. Run with `prek` (no Python needed for the native hooks) or
# `pre-commit`.
#
# `prek install` / `pre-commit install` wire only the pre-commit hook type unless told otherwise,
# which would leave the commit-msg hook below installed but never invoked.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless (auto-format)
        language: system
        entry: ./gradlew spotlessApply
        pass_filenames: false
        types: [java]

      - id: compile
        name: Compile
        language: system
        entry: ./gradlew compileJava compileTestJava
        pass_filenames: false
        types: [java]

      # SpotBugs and the test suite are intentionally omitted - too slow for a commit hook; run in CI.

      # Formatter, not linter - complements markdownlint-cli2 below (Prettier doesn't catch
      # MD024/MD032/MD060 and friends; markdownlint-cli2's MD013 has no auto-fix). `local`, not
      # `pre-commit/mirrors-prettier`: that mirror is stale (v3.1.0), so pinning the exact version
      # via npx instead.
      #
      # Config lives in .prettierrc.json, not flags here. printWidth there MUST match MD013's own
      # line_length in .markdownlint-cli2.jsonc - change one, change both. proseWrap: "always" is
      # load-bearing: Prettier's default (proseWrap: "preserve") never rewraps prose at all.
      # embeddedLanguageFormatting: "off" is separately load-bearing: Prettier's default ("auto")
      # reformats recognised-language content inside fenced code blocks too, which corrupts this
      # repo's YAML policy examples (dropped keys, emptied `{ }` blocks).
      #
      # `*emphasis*` becomes `_emphasis_` on first run and forever after - no config option to
      # avoid it.
      - id: prettier-markdown
        name: Prettier (auto-format Markdown)
        language: system
        entry: npx --yes prettier@3.9.6 --write
        pass_filenames: true
        types: [markdown]

  # Secret scanning - apt for a privacy pipeline (alterego/incognito) and its authoring CLI
  # (effigies).
  #
  # gitleaks-system, not the default gitleaks, which builds the binary from source with Go on
  # first run: that produces an unsigned, reputation-less executable in AppData, which Windows
  # Smart App Control blocks outright (os error 4551). Needs gitleaks on PATH (`scoop install
  # gitleaks`, `brew install gitleaks`, or a release binary).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # `gitleaks git --staged` reads the staged diff itself and takes at most one path, so
        # passing it the changed filenames makes it exit with "accepts at most 1 arg(s)".
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Frozen test vectors and vendored third-party fixtures must stay byte-identical to what was
      # generated/fetched -- AGENTS.md's hard invariant for the vectors, and SOURCES.md's recorded
      # SHA-256 provenance for the fixtures both depend on it. Auto-fixing whitespace/EOF in either
      # would silently violate that.
      - id: trailing-whitespace
        exclude: &vendored-fixtures |
          (?x)^(
            alterego/src/test/resources/vectors/|
            incognito/src/test/resources/benchmarks/LICENCES/|
            incognito/src/test/resources/benchmarks/.*\.sql
          )
      - id: end-of-file-fixer
        exclude: *vendored-fixtures
      - id: check-yaml
      - id: check-added-large-files  # guards the "fetch, don't vendor" discipline for large fixtures
      - id: check-merge-conflict
      # This repo deliberately uses the British spelling (LICENCE) - a near miss with LICENSE that
      # would collide silently on Windows/macOS's case-insensitive filesystems.
      - id: check-case-conflict
      # quickstart/run-quickstart.sh is committed 100755 today; this guards against a future re-add
      # losing that bit (harmless on Windows, but `./run-quickstart.sh` then fails on Linux/macOS).
      - id: check-shebang-scripts-are-executable
      # .gitattributes already pins eol=lf; this guards against that being weakened rather than
      # being the fix for it. Also excludes *.bat: .gitattributes separately pins `*.bat text
      # eol=crlf` (gradlew.bat needs CRLF to run on Windows), and an unexcluded --fix=lf would
      # rewrite it to LF, breaking it.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: |
          (?x)^(
            alterego/src/test/resources/vectors/|
            incognito/src/test/resources/benchmarks/LICENCES/|
            incognito/src/test/resources/benchmarks/.*\.sql|
            .*\.bat$
          )

  # Line-length gate only (see .markdownlint-cli2.jsonc) - catches >100-column Markdown, doesn't
  # fix it; MD013 has no auto-fix in any markdownlint implementation. Needs the Node-language hook
  # specifically, not the Ruby mdl gem: prek's Ruby support has no Windows auto-install path.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # quickstart/run-quickstart.sh is POSIX shell authored on Windows without Linux/macOS testing -
  # shellcheck catches the GNU-isms that would fail there. Python-packaged (shellcheck-py), not
  # the Docker variant - no separate binary install needed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # gradlew has the same #!/bin/sh shebang, but it's Gradle-vendored boilerplate, not ours
        # to fix shellcheck findings in.
        exclude: ^gradlew$

  # Link rot, on demand only: `prek run --hook-stage manual lychee` (or `pre-commit run
  # --hook-stage manual lychee`). Deliberately NOT on commit - external hosts fail for reasons
  # unrelated to the change under review, and a hook that blocks a commit over someone else's
  # downed server just gets bypassed.
  #
  # --method get, not the default HEAD: some hosts answer HEAD with an error and GET with 200.
  # Needs lychee on PATH (`scoop install lychee`, `brew install lychee`, or a release binary).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # Drift guards, not formatting - markdownlint-cli2 above catches structural rules, these catch a
  # narrower semantic one: an ADR's status casing/shape drifting from the MADR convention every
  # record here already follows (lowercase `status:` values, no Nygard-style "## Status" section).
  # `language: pygrep` is built into pre-commit/prek - a cross-platform grep whose `entry` is a
  # Python regex, failing when a file MATCHES (case-sensitive by default).
  - repo: local
    hooks:
      - id: lowercase-adr-status
        name: "ADR statuses are lowercase (MADR spelling)"
        language: pygrep
        entry: 'Superseded by ADR-|`(Accepted|Proposed|Rejected)`'
        files: ^docs/adr/

      - id: no-nygard-status-section
        name: "Records use MADR front-matter, not a Status section"
        language: pygrep
        entry: '^## Status$'
        files: ^docs/adr/

  # Conventional Commits, on the commit-msg stage. Python rather than the Node commitlint hook: no
  # config file, no additional_dependencies, and nothing compiled - matters on Windows, where
  # Smart App Control blocks locally built binaries.
  #
  # No `args:` - left at the hook's own built-in default type list (build, chore, ci, docs, feat,
  # fix, perf, refactor, revert, style, test), shared across every pre-commit-managed repo in this
  # workspace rather than a repo-specific subset: one fewer list to keep in sync.
  #
  # This checks the *shape* of a subject, not whether the type is the right one: `docs:` on a
  # change to alterego/ passes and is still wrong. It also accepts `Feat:` - there is no
  # case-sensitivity option, and --strict only blocks fixup and merge commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
