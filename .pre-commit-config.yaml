# Minimal code-hygiene hooks. Run with `prek` (no Python needed for the native hooks) or `pre-commit`.
# Kept deliberately small to start; SpotBugs + find-sec-bugs runs in CI, not on commit.
#
# `prek install` (and `pre-commit install`) wire only the pre-commit hook type unless told
# otherwise, which would leave the commit-msg hook below installed but never invoked. Declaring the
# types here means a plain `prek install` is enough - nobody has to remember `--hook-type`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless (auto-format)
        language: system
        entry: ./gradlew spotlessApply
        pass_filenames: false
        types: [java]

      - id: compile
        name: Compile
        language: system
        entry: ./gradlew compileJava compileTestJava
        pass_filenames: false
        types: [java]

      # SpotBugs and the test suite are intentionally omitted - too slow for a commit hook; run in CI.

      # Formatter, not linter - complements markdownlint-cli2 below rather than replacing it
      # (Prettier doesn't catch MD024/MD032/MD060 and friends; markdownlint-cli2's MD013 has no
      # auto-fix in any implementation - see the comment on that hook). `local`, not the
      # `pre-commit/mirrors-prettier` repo: that mirror is stale (its newest stable tag is v3.1.0,
      # several minor versions behind), so pinning the exact version via npx here instead - same
      # pattern as `npx --yes markdownlint-cli2@<version>` used throughout this repo's own tooling
      # invocations. `*emphasis*` becomes `_emphasis_` on first run and forever after - Prettier's
      # markdown printer has no config option for this, confirmed empirically; see
      # docs/adr/0036-adopt-prettier-for-markdown-alongside-markdownlint-cli2.md.
      # All actual options - proseWrap/printWidth/embeddedLanguageFormatting - live in
      # .prettierrc.json, not flags here (mirrors identigon.github.io's own .prettierrc.json).
      # proseWrap: "always" is the load-bearing one: Prettier's own default (proseWrap: "preserve")
      # never rewraps prose at all, so without a config file this hook silently did nothing about
      # the MD013 line-wrapping it was adopted to automate - confirmed empirically (an unwrapped
      # >100-column test line survived this exact command untouched with no config present) after
      # a site-review comparison against identigon.github.io caught the gap. printWidth: 100 matches
      # MD013's own line_length in .markdownlint-cli2.jsonc. embeddedLanguageFormatting: "off" is
      # separately load-bearing: Prettier's default ("auto") tries to reformat recognised-language
      # content INSIDE fenced code blocks too, and on this repo's YAML policy examples that
      # corrupted them - dropped keys, emptied `{ }` blocks - found and reverted during the initial
      # bulk reformat, confirmed fixed by diffing every fenced code block's content byte-for-byte
      # before/after with this flag set.
      - id: prettier-markdown
        name: Prettier (auto-format Markdown)
        language: system
        entry: npx --yes prettier@3.9.6 --write
        pass_filenames: true
        types: [markdown]

  # Secret scanning - apt for a privacy pipeline (alterego/incognito) and its authoring CLI
  # (effigies), where a salt or connection string must never be committed.
  #
  # gitleaks-system, not the default gitleaks, which builds the binary from source with Go on
  # first run: that produces an unsigned, reputation-less executable in AppData, which Windows
  # Smart App Control blocks outright (os error 4551). A packaged release carries enough download
  # reputation to run even with Smart App Control enforced. Needs gitleaks on PATH (confirmed
  # present via `scoop install gitleaks` in this environment) - same reasoning as doc-kit's and
  # play-bazlang's own .pre-commit-config.yaml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # `gitleaks git --staged` reads the staged diff itself and takes at most one path, so
        # passing it the changed filenames makes it exit with "accepts at most 1 arg(s)".
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Frozen test vectors and vendored third-party fixtures must stay byte-identical to what was
      # generated/fetched -- AGENTS.md's hard invariant for the vectors, and SOURCES.md's recorded
      # SHA-256 provenance for the fixtures both depend on it. Auto-fixing whitespace/EOF in either
      # would silently violate that (found the hard way: a first `--all-files` run trimmed trailing
      # spaces and normalized EOF newlines across both before this exclude existed).
      - id: trailing-whitespace
        exclude: &vendored-fixtures |
          (?x)^(
            alterego/src/test/resources/vectors/|
            incognito/src/test/resources/benchmarks/LICENCES/|
            incognito/src/test/resources/benchmarks/.*\.sql
          )
      - id: end-of-file-fixer
        exclude: *vendored-fixtures
      - id: check-yaml
      - id: check-added-large-files  # guards the "fetch, don't vendor" discipline for large fixtures
      - id: check-merge-conflict
      # This repo deliberately uses the British spelling (LICENCE) - a near miss with LICENSE that
      # would collide silently on Windows/macOS's case-insensitive filesystems, same reasoning as
      # doc-kit's own use of this hook.
      - id: check-case-conflict
      # quickstart/run-quickstart.sh is committed 100755 today; this guards against a future re-add
      # losing that bit (harmless on Windows, but `./run-quickstart.sh` then fails on Linux/macOS).
      - id: check-shebang-scripts-are-executable
      # .gitattributes already pins eol=lf; this guards against that being weakened rather than
      # being the fix for it. Same vendored-fixtures exclude as above - fixing a frozen fixture's
      # line endings would be the same kind of silent byte-level drift trailing-whitespace/
      # end-of-file-fixer are already excluded from it for (none currently use CRLF, checked).
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *vendored-fixtures

  # Line-length gate only (see .markdownlint-cli2.jsonc) -- catches >100-column Markdown, doesn't
  # fix it; MD013 has no auto-fix in any markdownlint implementation (checked directly: neither
  # this, the npm markdownlint-cli, nor the Ruby mdl gem rewrap a line). Pure prek/Node dependency,
  # no footprint in this repo (same pattern as gitleaks above) -- note this specifically needs the
  # Node-language hook, not the Ruby mdl gem: prek's Ruby support has no Windows auto-install path
  # (confirmed), while its Node support works cross-platform including Windows (also confirmed).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # The checker script (quickstart/run-quickstart.sh) is POSIX shell authored on Windows, without
  # Linux/macOS testing - shellcheck catches the GNU-isms that would fail there. Python-packaged
  # (shellcheck-py), not the Docker variant - same reasoning as gitleaks above, no separate binary
  # install needed. Verified clean against the current script before adding this hook.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Link rot, on demand only: `prek run --hook-stage manual lychee` (or `pre-commit run
  # --hook-stage manual lychee`). Deliberately NOT on commit - external hosts fail for reasons
  # unrelated to the change under review, and a hook that blocks a commit because someone else's
  # server is down is a hook that gets bypassed. Worth having now that docs/research/*.md and
  # docs/adr/ cite external references (17 URLs, checked). Ported from doc-kit's and
  # play-bazlang's own .pre-commit-config.yaml.
  # --method get, not the default HEAD: some hosts answer HEAD with an error and GET with 200, so
  # a HEAD-based sweep can report false failures. Needs lychee on PATH (confirmed present via
  # `scoop install lychee` in this environment).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # Drift guards, not formatting - markdownlint-cli2 above catches structural rules, these catch a
  # narrower semantic one: an ADR's status casing/shape drifting from the MADR convention every
  # record here already follows (lowercase `status:` values, no Nygard-style "## Status" section).
  # Ported from doc-kit's own .pre-commit-config.yaml, which found this exact drift risk worth
  # guarding after status casing survived several manual reviews there. `language: pygrep` is
  # built into pre-commit/prek - a cross-platform grep whose `entry` is a Python regex, failing
  # when a file MATCHES (case-sensitive by default). Verified against every ADR here first: no
  # existing file matches either pattern (all already lowercase, no "## Status" heading anywhere).
  - repo: local
    hooks:
      - id: lowercase-adr-status
        name: "ADR statuses are lowercase (MADR spelling)"
        language: pygrep
        entry: 'Superseded by ADR-|`(Accepted|Proposed|Rejected)`'
        types: [markdown]

      - id: no-nygard-status-section
        name: "Records use MADR front-matter, not a Status section"
        language: pygrep
        entry: '^## Status$'
        files: ^docs/adr/

  # Automates a Conventional Commits discipline already followed by hand throughout this repo's
  # history. Ported from doc-kit's own pre-commit config (Python rather than the Node commitlint
  # hook: no config file, no additional_dependencies, and nothing compiled - matters on Windows,
  # where Smart App Control blocks locally built binaries).
  #
  # The allowed types are this repo's own, not doc-kit's - checked against the real history
  # (`git log --format=%s`): `build`/`ci`/`docs`/`feat`/`fix`/`refactor`/`test` are the settled
  # vocabulary every commit since the monorepo consolidation (2026-08-10) has actually used.
  # `infra`/`release` appear only before that date - abandoned, not current convention
  # (`chore: Release v0.4.0` became `build: Release v3.2.0`, not a distinct thing kept alongside
  # it) - and `style` (in doc-kit's own list) has never been used here at all. `chore` shows the
  # same pre-2026-08-10-only pattern but is allowed back in regardless, by request.
  #
  # This checks the *shape* of a subject, not whether the type is the right one: `docs:` on a
  # change to alterego/ passes and is still wrong. It also accepts `Feat:` - there is no
  # case-sensitivity option, and --strict only blocks fixup and merge commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, refactor, test]
