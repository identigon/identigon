# Minimal code-hygiene hooks. Run with `prek` (no Python needed for the native hooks) or `pre-commit`.
# Kept deliberately small to start; SpotBugs + find-sec-bugs runs in CI, not on commit.
repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless (auto-format)
        language: system
        entry: ./gradlew spotlessApply
        pass_filenames: false
        types: [java]

      - id: compile
        name: Compile
        language: system
        entry: ./gradlew compileJava compileTestJava
        pass_filenames: false
        types: [java]

      # SpotBugs and the test suite are intentionally omitted - too slow for a commit hook; run in CI.

      # Formatter, not linter - complements markdownlint-cli2 below rather than replacing it
      # (Prettier doesn't catch MD024/MD032/MD060 and friends; markdownlint-cli2's MD013 has no
      # auto-fix in any implementation - see the comment on that hook). `local`, not the
      # `pre-commit/mirrors-prettier` repo: that mirror is stale (its newest stable tag is v3.1.0,
      # several minor versions behind), so pinning the exact version via npx here instead - same
      # pattern as `npx --yes markdownlint-cli2@<version>` used throughout this repo's own tooling
      # invocations. `*emphasis*` becomes `_emphasis_` on first run and forever after - Prettier's
      # markdown printer has no config option for this, confirmed empirically; see
      # docs/adr/0036-adopt-prettier-for-markdown-alongside-markdownlint-cli2.md.
      # --embedded-language-formatting=off is load-bearing, not cosmetic: Prettier's default
      # ("auto") tries to reformat recognised-language content INSIDE fenced code blocks too, and
      # on this repo's YAML policy examples that corrupted them - dropped keys, emptied `{ }`
      # blocks - found and reverted during the initial bulk reformat, confirmed fixed by diffing
      # every fenced code block's content byte-for-byte before/after with this flag set.
      - id: prettier-markdown
        name: Prettier (auto-format Markdown)
        language: system
        entry: npx --yes prettier@3.9.6 --embedded-language-formatting=off --write
        pass_filenames: true
        types: [markdown]

  # Secret scanning - apt for a privacy pipeline (alterego/incognito) and its authoring CLI
  # (effigies), where a salt or connection string must never be committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Frozen test vectors and vendored third-party fixtures must stay byte-identical to what was
      # generated/fetched -- AGENTS.md's hard invariant for the vectors, and SOURCES.md's recorded
      # SHA-256 provenance for the fixtures both depend on it. Auto-fixing whitespace/EOF in either
      # would silently violate that (found the hard way: a first `--all-files` run trimmed trailing
      # spaces and normalized EOF newlines across both before this exclude existed).
      - id: trailing-whitespace
        exclude: &vendored-fixtures |
          (?x)^(
            alterego/src/test/resources/vectors/|
            incognito/src/test/resources/benchmarks/LICENCES/|
            incognito/src/test/resources/benchmarks/.*\.sql
          )
      - id: end-of-file-fixer
        exclude: *vendored-fixtures
      - id: check-yaml
      - id: check-added-large-files  # guards the "fetch, don't vendor" discipline for large fixtures

  # Line-length gate only (see .markdownlint-cli2.jsonc) -- catches >100-column Markdown, doesn't
  # fix it; MD013 has no auto-fix in any markdownlint implementation (checked directly: neither
  # this, the npm markdownlint-cli, nor the Ruby mdl gem rewrap a line). Pure prek/Node dependency,
  # no footprint in this repo (same pattern as gitleaks above) -- note this specifically needs the
  # Node-language hook, not the Ruby mdl gem: prek's Ruby support has no Windows auto-install path
  # (confirmed), while its Node support works cross-platform including Windows (also confirmed).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
