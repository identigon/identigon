name: Build

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: FileMappingStore relies on FileChannel
        # locking, whose semantics differ from POSIX, and development happens on Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the root build.gradle.kts derives SNAPSHOT-vs-release from
          # `git describe --tags --exact-match`, which needs tags present to find anything.
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./gradlew build
